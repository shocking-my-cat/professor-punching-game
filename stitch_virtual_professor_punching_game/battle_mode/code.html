<script>
    // Simple script to demonstrate hit effect on the avatar area
    document.addEventListener('DOMContentLoaded', () => {
      const avatarContainer = document.querySelector('.group .relative.z-10');
      const flash = document.getElementById('hit-flash');
      const container = document.querySelector('.flex-1.w-full');

      avatarContainer.addEventListener('mousedown', (e) => {
        // Flash effect
        flash.style.opacity = '1';
        setTimeout(() => {
          flash.style.opacity = '0';
        }, 50);

        // Create floating damage number
        const dmg = document.createElement('div');
        dmg.textContent = '-10';
        dmg.className = 'absolute font-headline-md text-headline-md text-primary bg-primary-fixed border-border-width border-on-background px-sm py-base shadow-[4px_4px_0_0_#191c1e] z-30 pointer-events-none select-none';
        
        // Random positioning near click
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + (Math.random() * 40 - 20);
        const y = e.clientY - rect.top + (Math.random() * 40 - 20);
        
        const rotation = Math.random() * 30 - 15;
        
        dmg.style.left = `${x}px`;
        dmg.style.top = `${y}px`;
        dmg.style.transform = `rotate(${rotation}deg)`;
        
        container.appendChild(dmg);

        // Animate up and fade out
        let op = 1;
        let pos = 0;
        const anim = setInterval(() => {
          pos += 2;
          op -= 0.05;
          dmg.style.transform = `rotate(${rotation}deg) translateY(-${pos}px)`;
          dmg.style.opacity = op;
          if (op <= 0) {
            clearInterval(anim);
            dmg.remove();
          }
        }, 16);
      });
    });
  </script>
